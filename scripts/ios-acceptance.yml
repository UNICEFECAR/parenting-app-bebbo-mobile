appId: org.unicef.bebbodev
---
- launchApp:
    permissions:
      userTracking: deny
      notifications: deny
- tapOn:
    text: "(?i)Don.t Allow"
    optional: true
- tapOn:
    text: "Ask App Not to Track"
    optional: true
- tapOn:
    text: "(?i)Don.t Allow"
    optional: true
- extendedWaitUntil:
    visible: ".*Welcome!.*"
    timeout: 90000
- takeScreenshot: ios-welcome
- scrollUntilVisible:
    element: "(?i)continue"
- tapOn: "(?i)continue"
- tapOn:
    text: "^OK$"
    optional: true
- tapOn:
    text: "(?i)cancel"
    optional: true
- scrollUntilVisible:
    element: "(?is).*I have read, understood.*"
- tapOn:
    text: "(?is).*I have read, understood.*"
    point: "4%,50%"
- tapOn: "(?i)continue"
- assertVisible: ".*What is your name or nickname.*"
- takeScreenshot: ios-caregiver
- tapOn:
    # The field immediately under the asserted label has no accessibility ID.
    point: "50%,33%"
- inputText: "TestCaregiver"
- hideKeyboard
- tapOn: "(?i).*You are.*"
- tapOn: "(?i)mother"
- tapOn: "(?i)continue"
- scrollUntilVisible:
    element: "(?i)skip"
- tapOn: "(?i)skip"
- extendedWaitUntil:
    visible: ".*Daily reads.*"
    timeout: 180000
- takeScreenshot: ios-home
- tapOn: "(?i)^Tools(?:, tab, [0-9]+ of [0-9]+)?$"
- assertVisible: "(?i).*Vaccinations.*"
- takeScreenshot: ios-tools-before-vaccinations
# The existing iOS sheet combines three rows into one accessibility element.
# Exercise the visible row and verify the destination independently.
- tapOn:
    point: "28%,83%"
- tapOn:
    text: "(?i)continue"
    optional: true
- assertVisible: "(?i).*Vaccination summary.*"
- takeScreenshot: ios-vaccinations
- tapOn: "(?i)^Tools(?:, tab, [0-9]+ of [0-9]+)?$"
- assertVisible: "(?i).*Health check-ups.*"
- takeScreenshot: ios-tools-before-health-checkups
# The existing iOS sheet combines three rows into one accessibility element.
# Exercise the visible row and verify the destination independently.
- tapOn:
    point: "28%,90%"
- tapOn:
    text: "(?i)continue"
    optional: true
- assertVisible: "(?i).*Add doctor visit.*"
- takeScreenshot: ios-health-checkups
- tapOn: "(?i)^Tools(?:, tab, [0-9]+ of [0-9]+)?$"
- assertVisible: "(?i).*Child.s growth.*"
- takeScreenshot: ios-tools-before-growth
# The existing iOS sheet combines three rows into one accessibility element.
# Exercise the visible row and verify the destination independently.
- tapOn:
    point: "28%,96%"
- tapOn:
    text: "(?i)continue"
    optional: true
- assertVisible: "(?i).*No growth measurements recorded.*"
- takeScreenshot: ios-growth
