import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.UnresolvedDependencyResult

gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    app.tasks.register('reviewDependencyInventory') {
        doLast {
            def coordinates = { configuration ->
                def resolution = configuration.incoming.resolutionResult
                def unresolved = resolution.allDependencies.findAll {
                    it instanceof UnresolvedDependencyResult
                }
                if (!unresolved.empty) {
                    throw new GradleException("Incomplete dependency resolution for ${configuration.name}")
                }
                resolution.allComponents.collect { component -> component.id }
                    .findAll { it instanceof ModuleComponentIdentifier }
                    .collect { [group: it.group, name: it.module, version: it.version] }
                    .unique().sort { "${it.group}:${it.name}:${it.version}" }
            }
            def variants = app.configurations.findAll {
                it.canBeResolved && it.name.endsWith('ReleaseRuntimeClasspath')
            }.sort { it.name }.collect {
                [name: it.name, packages: coordinates(it)]
            }
            def report = [
                schema_version: 1,
                gradle_version: gradle.gradleVersion,
                variants: variants,
                root_buildscript: coordinates(gradle.rootProject.buildscript.configurations.classpath)
            ]
            def destination = app.findProperty('reviewDependencyInventoryFile')
            if (!destination) throw new GradleException('reviewDependencyInventoryFile is required')
            def output = new File(destination.toString())
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(report)) + '\n'
        }
    }
}
