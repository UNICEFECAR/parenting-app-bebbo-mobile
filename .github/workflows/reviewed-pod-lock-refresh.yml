name: Refresh reviewed native dependency lock
on:
  push:
    branches: [RNSDKUpgrade-review-fixes]
    paths: [.github/workflows/reviewed-pod-lock-refresh.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      FLAVOR: bebbo
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install reviewed patch candidates
        run: npm install --save-exact --legacy-peer-deps i18next@27.1.2 react-native-notify-kit@10.10.1 lottie-react-native@7.5.1
      - run: node scripts/ci-fixtures.cjs
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Resolve only the two changed native pods
        working-directory: ios
        run: bundle exec pod update RNNotifee lottie-react-native --no-repo-update
      - name: Verify deployment install preserves the new lock
        working-directory: ios
        run: |
          cp Podfile.lock /tmp/reviewed.Podfile.lock
          bundle exec pod install --deployment
          cmp Podfile.lock /tmp/reviewed.Podfile.lock
      - name: Collect resolved inputs
        run: |
          mkdir -p /tmp/reviewed-native-lock
          cp ios/Podfile.lock /tmp/reviewed-native-lock/
          cp "ios/Pods/Local Podspecs/RNNotifee.podspec.json" /tmp/reviewed-native-lock/
          cp "ios/Pods/Local Podspecs/lottie-react-native.podspec.json" /tmp/reviewed-native-lock/
          node -e 'const fs=require("fs"); const names=["i18next","react-native-notify-kit","lottie-react-native"]; const versions=Object.fromEntries(names.map(n=>[n,require(n+"/package.json").version])); fs.writeFileSync("/tmp/reviewed-native-lock/versions.json",JSON.stringify(versions,null,2));'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-native-lock
          path: /tmp/reviewed-native-lock
          if-no-files-found: error
